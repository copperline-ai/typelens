# Manually cut a release on `main` (same release-it + AI changelog as path-triggered workflows).
name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Which product to release"
        required: true
        type: choice
        options:
          - dashboard
      release_level:
        description: "Semver increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_message:
        description: "Optional note (markdown) prepended to the generated release changelog"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-manual-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Map product to paths
        id: map
        run: |
          case "${{ inputs.product }}" in
            dashboard)
              echo "workdir=apps/dashboard" >> "$GITHUB_OUTPUT"
              echo "config=dashboard.json" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown product: ${{ inputs.product }}"
              exit 1
              ;;
          esac

      - name: Ensure GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Configure Git user for release commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync branch with latest main
        run: |
          git fetch origin main
          git pull --rebase origin main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-sync main before release-it
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: release-it (manual increment + AI changelog)
        working-directory: ${{ steps.map.outputs.workdir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          RELEASE_AI_MODEL: ${{ vars.RELEASE_AI_MODEL }}
          RELEASE_BUMP_OVERRIDE: ${{ inputs.release_level }}
          RELEASE_MESSAGE_PREFIX: ${{ inputs.release_message }}
        run: ../../node_modules/.bin/release-it --ci -c ../../.release-it/${{ steps.map.outputs.config }} "${{ inputs.release_level }}"

      - name: Read new version from package.json
        id: version
        working-directory: ${{ steps.map.outputs.workdir }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "new_version=$version" >> "$GITHUB_OUTPUT"
