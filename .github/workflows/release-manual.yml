# Manually cut a release on `main` (same release-it + AI changelog as path-triggered workflows).
name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Which product to release"
        required: true
        type: choice
        options:
          - typelens
      release_level:
        description: "Semver increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_message:
        description: "Optional note (markdown) prepended to the generated release changelog"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release-manual-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Map product to config
        id: map
        run: |
          case "${{ inputs.product }}" in
            typelens)
              echo "config=typelens.json" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown product: ${{ inputs.product }}"
              exit 1
              ;;
          esac

      - name: Ensure GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Configure Git user for release commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync branch with latest main
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-sync main before release-it
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: release-it (manual increment + AI changelog)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          RELEASE_AI_MODEL: ${{ vars.RELEASE_AI_MODEL }}
          RELEASE_BUMP_OVERRIDE: ${{ inputs.release_level }}
          RELEASE_MESSAGE_PREFIX: ${{ inputs.release_message }}
        run: ./node_modules/.bin/release-it --ci -c .release-it/${{ steps.map.outputs.config }} "${{ inputs.release_level }}"

      - name: Read new version from package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "new_version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=typelens-v$version" >> "$GITHUB_OUTPUT"

  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.new_version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  notify-failure:
    if: failure()
    needs: [release, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Paperclip on CI failure
        env:
          PAPERCLIP_WEBHOOK_URL: ${{ secrets.PAPERCLIP_WEBHOOK_URL }}
          PAPERCLIP_WEBHOOK_SECRET: ${{ secrets.PAPERCLIP_WEBHOOK_SECRET }}
        run: |
          if [ -z "$PAPERCLIP_WEBHOOK_URL" ] || [ -z "$PAPERCLIP_WEBHOOK_SECRET" ]; then
            echo "PAPERCLIP_WEBHOOK_URL or PAPERCLIP_WEBHOOK_SECRET not set — skipping notification"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg source "github_actions" \
            --arg workflow "${{ github.workflow }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit_sha "${{ github.sha }}" \
            --arg commit_message "${{ github.event.head_commit.message }}" \
            '{source: $source, workflow: $workflow, run_id: $run_id, run_url: $run_url, branch: $branch, commit_sha: $commit_sha, commit_message: $commit_message}')
          curl -sf -X POST "$PAPERCLIP_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $PAPERCLIP_WEBHOOK_SECRET" \
            -d "$PAYLOAD"
