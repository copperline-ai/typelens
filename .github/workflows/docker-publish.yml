name: Docker Publish

on:
  workflow_call:
    inputs:
      version:
        description: "Semver version to tag (e.g. 1.2.3)"
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        run: |
          docker run --rm --privileged tonistiigi/binfmt:latest --install all

      - name: Set up Docker Buildx
        run: |
          docker buildx version
          docker buildx create --use --bootstrap

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        shell: bash
        run: |
          TAGS="--tag ghcr.io/copperline-ai/typelens:latest"
          if [ -n "${{ inputs.version }}" ]; then
            TAGS="$TAGS --tag ghcr.io/copperline-ai/typelens:${{ inputs.version }}"
          fi
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --provenance false \
            $TAGS \
            --label "org.opencontainers.image.source=https://github.com/copperline-ai/typelens" \
            --cache-from type=gha \
            --cache-from type=registry,ref=ghcr.io/copperline-ai/typelens:buildcache \
            --cache-to type=gha,mode=max \
            --cache-to type=registry,ref=ghcr.io/copperline-ai/typelens:buildcache,mode=max \
            .
