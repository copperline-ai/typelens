name: Release (jobs)

on:
  push:
    branches:
      - main
    paths:
      - "apps/jobs/**"
      - ".release-it/jobs.json"
      - "packages/release-it-ai-gateway/**"
      - ".github/workflows/release-jobs.yml"

permissions:
  contents: write

concurrency:
  group: release-jobs
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git user for release commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync branch with latest main
        run: |
          git fetch origin main
          git pull --rebase origin main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-sync main before release-it
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: release-it (AI bump + GitHub release)
        working-directory: apps/jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          RELEASE_AI_MODEL: ${{ vars.RELEASE_AI_MODEL }}
        run: ../../node_modules/.bin/release-it --ci -c ../../.release-it/jobs.json

      - name: Read new version from package.json
        id: version
        working-directory: apps/jobs
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "new_version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=jobs-v$version" >> "$GITHUB_OUTPUT"

      - name: Deploy to Trigger.dev (CLI)
        working-directory: apps/jobs
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: bun run deploy:ci
