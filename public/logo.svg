<svg viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="typelens logo">
  <!-- Icon: magnifying glass (vertically centered in 48px height) -->
  <!-- Outer soft ring (light blue) -->
  <circle cx="24" cy="21" r="13.5" stroke="#7ec8e3" stroke-width="0.5" opacity="0.7"/>
  <!-- Lens rim (metallic blue) -->
  <circle cx="24" cy="21" r="11.5" stroke="#0067a3" stroke-width="2.75"/>
  <!-- Lens glass subtle fill -->
  <circle cx="24" cy="21" r="10" fill="#00457e" fill-opacity="0.12"/>
  <!-- Inner teal accent ring -->
  <circle cx="24" cy="21" r="7.5" stroke="#00d2da" stroke-width="1.25"/>
  <!-- Network lines -->
  <line x1="24" y1="19.2" x2="24" y2="15.5" stroke="#00d2da" stroke-width="0.75" opacity="0.6"/>
  <line x1="25.9" y1="22.1" x2="28.5" y2="23.6" stroke="#00d2da" stroke-width="0.75" opacity="0.6"/>
  <line x1="22.1" y1="22.1" x2="19.5" y2="23.6" stroke="#00d2da" stroke-width="0.75" opacity="0.6"/>
  <!-- Network satellite nodes -->
  <circle cx="24" cy="14.75" r="1.1" fill="#00d2da" opacity="0.8"/>
  <circle cx="29.25" cy="24.25" r="1.1" fill="#00d2da" opacity="0.8"/>
  <circle cx="18.75" cy="24.25" r="1.1" fill="#00d2da" opacity="0.8"/>
  <!-- Center hub -->
  <circle cx="24" cy="21" r="2.5" fill="#00d2da"/>
  <!-- Handle (deep blue) -->
  <path d="M33.2 29.8 L41.5 38" stroke="#00457e" stroke-width="3.75" stroke-linecap="round"/>
  <!-- Grip band 1 (black) -->
  <path d="M35.2 31.8 L37.2 33.8" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Grip band 2 (black) -->
  <path d="M38.1 34.7 L40.1 36.7" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wordmark: "type" metallic blue + "lens" vibrant teal, inline via tspan -->
  <text
    x="52"
    y="30"
    font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="-0.5"
  >
    <tspan fill="#0067a3">type</tspan><tspan fill="#00d2da">lens</tspan>
  </text>
</svg>
