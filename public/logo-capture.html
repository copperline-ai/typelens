<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 512px; height: 512px; overflow: hidden; background: transparent !important; }

  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#00457e"/>
  <text x="256" y="278" text-anchor="middle" dominant-baseline="central"
    font-family="'Space Grotesk', Inter, system-ui, sans-serif"
    font-weight="600" font-size="380" letter-spacing="-10">
    <tspan fill="#7ec8e3">t</tspan><tspan fill="#00d2da">l</tspan>
  </text>
</svg>
</body>
</html>
