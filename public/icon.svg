<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="typelens icon">
  <defs>
    <clipPath id="lens-clip">
      <circle cx="12.5" cy="12.5" r="9.5"/>
    </clipPath>
  </defs>
  <!-- Handle (drawn first, behind lens) -->
  <line x1="19.5" y1="19.5" x2="30" y2="30" stroke="#1a4082" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Grip band -->
  <line x1="23" y1="23" x2="26.5" y2="26.5" stroke="#0d1426" stroke-width="2" stroke-linecap="round"/>
  <!-- Lens fill + outer ring -->
  <circle cx="12.5" cy="12.5" r="10.5" fill="#edf5fb" stroke="#1a4082" stroke-width="2"/>
  <!-- Concentric inner rings -->
  <circle cx="12.5" cy="12.5" r="7.9" stroke="#2b6cc0" stroke-width="0.9" clip-path="url(#lens-clip)"/>
  <circle cx="12.5" cy="12.5" r="5.6" stroke="#4d8ec8" stroke-width="0.8" clip-path="url(#lens-clip)"/>
  <circle cx="12.5" cy="12.5" r="3.4" stroke="#7ab2d8" stroke-width="0.7" clip-path="url(#lens-clip)"/>
  <!-- Analytics trend line (teal) -->
  <polyline
    points="7,17.5 12.5,12.5 18,7.5"
    stroke="#00c8d4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
    clip-path="url(#lens-clip)"/>
  <!-- Dots on trend line -->
  <circle cx="7" cy="17.5" r="1.2" fill="#00c8d4" clip-path="url(#lens-clip)"/>
  <circle cx="12.5" cy="12.5" r="1.2" fill="#00c8d4" clip-path="url(#lens-clip)"/>
  <circle cx="18" cy="7.5" r="1.2" fill="#00c8d4" clip-path="url(#lens-clip)"/>
</svg>
