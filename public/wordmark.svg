<svg viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="typelens wordmark">
  <defs>
    <clipPath id="lens-clip">
      <circle cx="25" cy="25" r="19"/>
    </clipPath>
  </defs>
  <!-- Handle (behind lens) -->
  <line x1="39" y1="39" x2="58" y2="58" stroke="#1a4082" stroke-width="7" stroke-linecap="round"/>
  <!-- Grip band -->
  <line x1="46" y1="46" x2="52" y2="52" stroke="#0d1426" stroke-width="4" stroke-linecap="round"/>
  <!-- Lens fill + outer ring -->
  <circle cx="25" cy="25" r="21" fill="#edf5fb" stroke="#1a4082" stroke-width="4"/>
  <!-- Concentric inner rings -->
  <circle cx="25" cy="25" r="15.8" stroke="#2b6cc0" stroke-width="1.8" clip-path="url(#lens-clip)"/>
  <circle cx="25" cy="25" r="11.2" stroke="#4d8ec8" stroke-width="1.5" clip-path="url(#lens-clip)"/>
  <circle cx="25" cy="25" r="6.8" stroke="#7ab2d8" stroke-width="1.2" clip-path="url(#lens-clip)"/>
  <!-- Analytics trend line (teal) -->
  <polyline
    points="14,35 25,25 36,15"
    stroke="#00c8d4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
    clip-path="url(#lens-clip)"/>
  <!-- Dots on trend line -->
  <circle cx="14" cy="35" r="2.4" fill="#00c8d4" clip-path="url(#lens-clip)"/>
  <circle cx="25" cy="25" r="2.4" fill="#00c8d4" clip-path="url(#lens-clip)"/>
  <circle cx="36" cy="15" r="2.4" fill="#00c8d4" clip-path="url(#lens-clip)"/>
  <!-- Wordmark: "type" dark navy + "lens" teal -->
  <text
    x="70"
    y="41"
    font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="-0.5"
  >
    <tspan fill="#1a4082">type</tspan><tspan fill="#00c8d4">lens</tspan>
  </text>
</svg>
