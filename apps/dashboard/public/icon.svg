<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="typelens icon">
  <!-- Outer soft ring (light blue) -->
  <circle cx="13" cy="13" r="12.25" stroke="#7ec8e3" stroke-width="0.5" opacity="0.7"/>
  <!-- Lens rim (metallic blue) -->
  <circle cx="13" cy="13" r="10.75" stroke="#0067a3" stroke-width="2.75"/>
  <!-- Lens glass (subtle fill) -->
  <circle cx="13" cy="13" r="9.375" fill="#00457e" fill-opacity="0.12"/>
  <!-- Inner teal accent ring -->
  <circle cx="13" cy="13" r="7" stroke="#00d2da" stroke-width="1.25"/>
  <!-- Network lines (teal) -->
  <line x1="13" y1="11.2" x2="13" y2="8" stroke="#00d2da" stroke-width="0.75" opacity="0.6"/>
  <line x1="14.9" y1="14.1" x2="17.2" y2="15.4" stroke="#00d2da" stroke-width="0.75" opacity="0.6"/>
  <line x1="11.1" y1="14.1" x2="8.8" y2="15.4" stroke="#00d2da" stroke-width="0.75" opacity="0.6"/>
  <!-- Network satellite nodes -->
  <circle cx="13" cy="7.25" r="1.1" fill="#00d2da" opacity="0.8"/>
  <circle cx="17.75" cy="15.75" r="1.1" fill="#00d2da" opacity="0.8"/>
  <circle cx="8.25" cy="15.75" r="1.1" fill="#00d2da" opacity="0.8"/>
  <!-- Center hub (vibrant teal) -->
  <circle cx="13" cy="13" r="2.25" fill="#00d2da"/>
  <!-- Handle (deep blue) -->
  <path d="M21.6 21.6 L29.5 29.5" stroke="#00457e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Grip band 1 (black) -->
  <path d="M23.5 23.5 L25.4 25.4" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Grip band 2 (black) -->
  <path d="M26.3 26.3 L28.2 28.2" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
